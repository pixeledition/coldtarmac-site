<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cold Tarmac</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0a0a0a;
      color: #f0f0f0;
      font-family: 'Segoe UI', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    .logo {
      font-size: 3rem;
      font-weight: 800;
      letter-spacing: -1px;
      color: #fff;
      margin-bottom: 0.5rem;
    }
    .logo span { color: #e63946; }
    .tagline {
      font-size: 1.1rem;
      color: #888;
      margin-bottom: 3rem;
      text-align: center;
    }
    .description {
      max-width: 560px;
      text-align: center;
      line-height: 1.7;
      color: #ccc;
      font-size: 1rem;
      margin-bottom: 3rem;
    }
    .links {
      display: flex;
      gap: 2rem;
      font-size: 0.85rem;
    }
    .links a {
      color: #555;
      text-decoration: none;
      transition: color 0.2s;
    }
    .links a:hover { color: #e63946; }
    .tiktok-link {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: #e63946;
      color: #fff;
      padding: 0.75rem 1.5rem;
      border-radius: 4px;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.95rem;
      margin-bottom: 3rem;
      transition: background 0.2s;
    }
    .tiktok-link:hover { background: #c1121f; }
  </style>
</head>
<body>
  <div class="logo">Cold<span>Tarmac</span></div>
  <p class="tagline">AI-generated car content. Every day.</p>
  <p class="description">
    Cold Tarmac is an automated content pipeline that generates AI-produced car showcase videos — full reveals, mosaics, and head-to-head showdowns — and delivers them daily to TikTok.
  </p>
  <a class="tiktok-link" href="https://www.tiktok.com/@coldtarmac" target="_blank">
    Watch on TikTok
  </a>
  <div class="links">
    <a href="tos.html">Terms of Service</a>
    <a href="privacy.html">Privacy Policy</a>
  </div>
</body>
</html>
